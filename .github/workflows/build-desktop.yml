name: Build desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: DrivePro-macOS-Apple-Silicon
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: DrivePro-macOS-Intel
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: DrivePro-Windows-x64
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            bundle: nsis
            artifact: DrivePro-Windows-x86

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS installer
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          dmg=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          mountpoint="$RUNNER_TEMP/drivepro-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach "${dmg[0]}" -mountpoint "$mountpoint" -nobrowse -quiet
          trap 'hdiutil detach "$mountpoint" -quiet' EXIT
          codesign --verify --deep --strict --verbose=2 "$mountpoint/DrivePro.app"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
